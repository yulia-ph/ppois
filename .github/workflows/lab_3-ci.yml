name: Lab 3 CI

on:
  push:
    branches: [ main ]
    tags: [ 'v3*' ]
    paths:
      - 'lab_3/**'
      - '.github/workflows/lab_3-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'lab_3/**'

jobs:
  test-and-build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: lab_3
        run: uv sync --all-extras

      - name: Lint with ruff
        working-directory: lab_3
        run: uv run ruff check .

      - name: Test with coverage
        working-directory: lab_3
        run: |
          uv run pytest tests/ \
            --cov=logistics_core --cov=logistics_fleet --cov=logistics_cargo \
            --cov=logistics_people --cov=logistics_orders --cov=logistics_routes \
            --cov=logistics_warehouse --cov=logistics_documents \
            --cov-report=term-missing --cov-fail-under=90

      - name: Build demo binary
        working-directory: lab_3
        run: uv run pyinstaller --onefile --name logistics-demo main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab_3-binary
          path: lab_3/dist/logistics-demo

      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/v3')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lab_3/dist/logistics-demo
