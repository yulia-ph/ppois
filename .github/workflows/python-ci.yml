name: Python CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'lab_1/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'lab_1/**'

jobs:
  test-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4



      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: lab_1
        run: uv sync --all-extras

      - name: Lint with ruff
        working-directory: lab_1
        run: uv run ruff check .

      - name: Test dictionary
        working-directory: lab_1
        run: uv run pytest dictionary/ --cov=dictionary --cov-report=term-missing --cov-fail-under=90

      - name: Test polynomial
        working-directory: lab_1
        run: uv run pytest polynomial/ --cov=polynomial --cov-report=term-missing --cov-fail-under=90

      - name: Build dictionary binary
        working-directory: lab_1/dictionary
        run: uv run pyinstaller --onefile --name dictionary main.py

      - name: Build polynomial binary
        working-directory: lab_1/polynomial
        run: uv run pyinstaller --onefile --name polynomial main.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            lab_1/dictionary/dist/dictionary
            lab_1/polynomial/dist/polynomial

      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lab_1/dictionary/dist/dictionary
            lab_1/polynomial/dist/polynomial
