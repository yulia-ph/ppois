name: Lab 2 CI

on:
  push:
    branches: [ main ]
    tags: [ 'v2*' ]
    paths:
      - 'lab_2/**'
      - '.github/workflows/lab_2-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'lab_2/**'

jobs:
  test-and-build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: lab_2
        run: uv sync --all-extras

      - name: Lint with ruff
        working-directory: lab_2
        run: uv run ruff check .

      - name: Test with coverage
        working-directory: lab_2
        run: |
          uv run pytest tests/ \
            --cov=museum_core --cov=museum_exhibits --cov=museum_people \
            --cov=museum_sales --cov=museum_security --cov=museum_events \
            --cov=museum_exhibitions --cov=museum_documents \
            --cov-report=term-missing --cov-fail-under=90

      - name: Build demo binary
        working-directory: lab_2
        run: uv run pyinstaller --onefile --name museum-demo main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab_2-binary
          path: lab_2/dist/museum-demo

      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/v2')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lab_2/dist/museum-demo